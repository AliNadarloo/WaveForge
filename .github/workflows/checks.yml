# Made by Ali Nadarloo.
name: Tests and lightweight Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.txt pytest pandas
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests -q
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py --output release/WaveForge
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: WaveForge-Windows
          path: delivery/
